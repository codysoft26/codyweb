<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NullClaw - Agentes & Webhooks</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #111827;
            --border: #1f2937;
            --accent: #38bdf8;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); padding: 2rem 1rem; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 3rem; }
        .battery-wrapper { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 1rem; }
        .battery-icon { width: 40px; height: 20px; border: 2px solid var(--accent); border-radius: 3px; position: relative; padding: 2px; }
        .battery-level { width: 60%; height: 100%; background: var(--accent); border-radius: 1px; }
        h1 { font-size: 2.75rem; background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.75rem; }
        .subtitle { color: var(--text-muted); font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="battery-wrapper">
                <div class="battery-icon"><div class="battery-level"></div></div>
                <span style="color: var(--text-muted); font-size: 0.9rem;">60% restante</span>
            </div>
            <h1>NullClaw Architecture</h1>
            <p class="subtitle">Explorando Agentes Autónomos y Webhooks en Tiempo Real</p>
        </header>
    </div>
</body>
</html>
